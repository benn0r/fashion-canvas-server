name: Build, test and publish
on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck

  build:
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - run: npm ci
      - run: npm run build

  test:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - run: npm ci
      - run: npm test

  test-e2e:
    needs: build
    runs-on: ubuntu-latest
    container:
      image: ${{ vars.PLAYWRIGHT_IMAGE }}
      credentials:
        username: ${{ gitea.actor }}
        password: ${{ secrets.REGISTRY_TOKEN }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: npm ci
      - run: npm run test:e2e

  publish-image:
    if: gitea.event_name == 'push'
    needs: [build, test, test-e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Log in to Gitea Container Registry
        shell: sh
        env:
          GITEA_SERVER_URL: ${{ gitea.server_url }}
          REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
          REGISTRY_USERNAME: ${{ gitea.repository_owner }}
        run: |
          registry="${GITEA_SERVER_URL#*://}"
          printf '%s' "${REGISTRY_TOKEN}" \
            | docker login "${registry}" --username "${REGISTRY_USERNAME}" --password-stdin
      - name: Build and push image
        shell: sh
        env:
          GITEA_SERVER_URL: ${{ gitea.server_url }}
          REGISTRY_OWNER: ${{ gitea.repository_owner }}
          SOURCE_COMMIT: ${{ gitea.sha }}
        run: |
          registry="${GITEA_SERVER_URL#*://}"
          image="${registry}/${REGISTRY_OWNER}/fashion-canvas-server"
          docker build --tag "${image}:${SOURCE_COMMIT}" --tag "${image}:latest" .
          docker push "${image}:${SOURCE_COMMIT}"
          docker push "${image}:latest"
