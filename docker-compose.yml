services:
  app:
    build: .
    restart: unless-stopped
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_VISION_MODEL: ${OPENAI_VISION_MODEL:-gpt-4.1-mini}
      OPENAI_IMAGE_MODEL: ${OPENAI_IMAGE_MODEL:-gpt-image-2}
      INPUT_MAX_DIMENSION: ${INPUT_MAX_DIMENSION:-1280}
      TRUST_PROXY: ${TRUST_PROXY:-1}
      DATABASE_PATH: /data/fashion-canvas.sqlite
    volumes:
      - fashion-canvas-data:/data
    ports:
      - "3000"
volumes:
  fashion-canvas-data:
