<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Fashion Canvas — Account</title>
    <link rel="icon" type="image/png" href="/app-icon.png" />
    <link rel="stylesheet" href="/styles.css" />
    <link rel="stylesheet" href="/responsive.css" />
  </head>
  <body class="account-page">
    <header class="account-header">
      <a class="brand" href="/account.html"
        ><img src="/app-icon.png" alt="" /><strong>Fashion Canvas</strong></a
      >
    </header>
    <main class="account-main">
      <section class="account-card">
        <p class="eyebrow">USER ACCESS</p>
        <h1>Welcome</h1>
        <p>Create an account or log in. New accounts can upload after administrator approval.</p>
        <div class="account-tabs" role="tablist">
          <button class="active" data-account-tab="login" type="button">Log in</button>
          <button data-account-tab="register" type="button">Register</button>
        </div>
        <form id="account-form">
          <input id="account-mode" type="hidden" value="login" />
          <label
            >Username<input
              id="username"
              name="username"
              autocomplete="username"
              required
              minlength="3"
              maxlength="32"
          /></label>
          <label
            >Password<input
              id="password"
              name="password"
              type="password"
              autocomplete="current-password"
              required
              minlength="8"
              maxlength="128"
          /></label>
          <button id="account-submit" type="submit">Log in</button>
          <p id="account-message" role="status"></p>
        </form>
      </section>
    </main>
    <script src="/account.js" defer></script>
  </body>
</html>
